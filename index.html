<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>UTM.io Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oxygen:wght@400;700&family=Source+Code+Pro:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar">
    <div class="ws" id="ws" role="button" tabindex="0" aria-label="Switch workspace">
      <img src="assets/logo.png" alt="">
      <span class="ws-name">Acme Marketing</span>
      <svg class="caret" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <nav class="nav" id="nav" aria-label="Workspace"></nav>
    <div class="collapse"><button id="collapse-btn" aria-label="Collapse sidebar"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menu-btn" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <span class="topbar-title" id="topbar-title">Analytics</span>
      <button class="btn-ext" id="ext-btn">Download Chrome Extension</button>
      <span class="spacer"></span>
      <button class="pill-plan" id="plan-btn">Manage Plan</button>
      <button class="menu-trigger manage" id="manage-btn" aria-haspopup="menu">Manage <svg class="caret" width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="menu-trigger" id="user-btn" aria-haspopup="menu"><span class="avatar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg></span>Tyler Berry <svg class="caret" width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="drawer-scrim" id="drawer-scrim" hidden></div>
<button class="help-btn" id="help-btn">Need Help? <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4z"/></svg></button>
<div class="toast-wrap" id="toasts" aria-live="polite"></div>
<div id="layer"></div>
<script src="map-data.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
